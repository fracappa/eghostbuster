name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update Helm chart version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          sed -i "s/^version: .*/version: $VERSION/" deployment/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$VERSION\"/" deployment/Chart.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Package Helm chart
        run: |
          helm package deployment/
          ls -lh eghostbuster-*.tgz

      - name: Login to GitHub Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Helm chart to GHCR
        run: |
          CHART_FILE=$(ls eghostbuster-*.tgz)
          helm push "$CHART_FILE" oci://ghcr.io/${{ github.repository_owner }}/helm-charts

      - name: Create Helm release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          files: |
            eghostbuster-*.tgz
            deployment/Chart.yaml
            deployment/values.yaml
            deployment/README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
